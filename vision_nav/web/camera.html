<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Vision Nav camera</title>
<style>
body{margin:0;background:#000;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
#view{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain}
#bar{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;
  background:rgba(0,0,0,.55);font-size:13px}
.pill{padding:3px 9px;border-radius:10px;background:#333}
.ok{background:#1d5c33}.bad{background:#6b1f1f}.warn{background:#6b561f}
button,select{background:#2b2f38;color:#eee;border:1px solid #444;border-radius:8px;padding:7px 10px;font-size:14px}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;padding:18px 28px;background:#4c8dff;border:0}
#msg{position:fixed;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(0,0,0,.55);font-size:13px;min-height:18px}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="bar">
  <span class="pill" id="pWs">server</span>
  <span class="pill" id="pFps">0 fps</span>
  <span class="pill" id="pCorners">corners 0/4</span>
  <span class="pill" id="pRobot">robot</span>
  <span class="pill" id="pPerson">person</span>
  <select id="res"><option value="640">640 px</option><option value="960" selected>960 px</option><option value="1280">1280 px</option></select>
  <button id="flip">switch camera</button>
</div>
<button id="start">Start camera</button>
<div id="msg">Mount the phone high and steady, aim it at the arena so all 4 corner markers are visible.</div>
<video id="video" playsinline muted style="display:none"></video>
<script src="vendor/cv.js"></script>
<script src="vendor/aruco.js"></script>
<script src="vendor/aruco_4x4_1000.js"></script>
<script>
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
let key = qs.get('key');
try { if (key) localStorage.setItem('vnKey', key); else key = localStorage.getItem('vnKey') || ''; } catch (e) {}

const detector = new AR.Detector({dictionaryName: 'ARUCO_4X4_1000'});
const video = $('video'), view = $('view'), vctx = view.getContext('2d');
const work = document.createElement('canvas'), wctx = work.getContext('2d', {willReadFrequently: true});
let ws, overlay = null, facing = 'environment', stream = null, frames = 0, fps = 0, lastFpsT = performance.now();
let lastSent = 0, wakeLock = null, control = false, loopTimer = null;

// ---------------------------------------------------------------- server link
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => ws.send(JSON.stringify({type: 'hello', role: 'camera', key}));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'welcome') control = m.control;
    else if (m.type === 'overlay') overlay = m;
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
connect();

// ---------------------------------------------------------------- camera
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $('msg').textContent = 'Camera API not available - the page must be opened over https.';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: false,
      video: {facingMode: facing, width: {ideal: 1920}, height: {ideal: 1080}}});
  } catch (e) {
    $('msg').textContent = 'Camera error: ' + e.message;
    return;
  }
  video.srcObject = stream;
  await video.play();
  $('start').style.display = 'none';
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  if (!loopTimer) loopTimer = setInterval(loop, 15);   // a timer keeps running when the tab is hidden
}
$('start').onclick = startCamera;
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); };
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && stream && !wakeLock) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
});

// ---------------------------------------------------------------- detection loop
function loop() {
  if (video.readyState < 2) return;
  const now = performance.now();
  if (now - lastSent < 66) return;          // ~15 fps max
  lastSent = now;

  const vw = video.videoWidth, vh = video.videoHeight;
  const pw = Math.min(+$('res').value, vw), ph = Math.round(vh * pw / vw);
  if (work.width !== pw) { work.width = pw; work.height = ph; }
  wctx.drawImage(video, 0, 0, pw, ph);
  const img = wctx.getImageData(0, 0, pw, ph);
  const found = detector.detect(img);

  const markers = {};
  for (const m of found) if (m.id <= 5) markers[m.id] = m.corners.map(c => [c.x, c.y]);
  if (ws.readyState === 1 && control)
    ws.send(JSON.stringify({type: 'frame', w: pw, h: ph, markers}));

  // display: the video with detections and the server's plan drawn on top
  if (view.width !== innerWidth * devicePixelRatio) {
    view.width = innerWidth * devicePixelRatio; view.height = innerHeight * devicePixelRatio;
  }
  const s = Math.min(view.width / pw, view.height / ph);
  const ox = (view.width - pw * s) / 2, oy = (view.height - ph * s) / 2;
  const P = ([x, y]) => [ox + x * s, oy + y * s];
  vctx.fillStyle = '#000'; vctx.fillRect(0, 0, view.width, view.height);
  vctx.drawImage(work, ox, oy, pw * s, ph * s);
  drawOverlay(P);
  vctx.lineWidth = 3 * devicePixelRatio; vctx.font = `bold ${16 * devicePixelRatio}px system-ui`;
  for (const m of found) {
    const col = m.id === 0 ? '#4c8dff' : m.id === 5 ? '#a46bff' : m.id <= 4 ? '#3ccf6e' : '#888';
    vctx.strokeStyle = col; vctx.beginPath();
    m.corners.forEach((c, i) => { const [x, y] = P([c.x, c.y]); i ? vctx.lineTo(x, y) : vctx.moveTo(x, y); });
    vctx.closePath(); vctx.stroke();
    // top edge (marker "forward") in white
    const [ax, ay] = P([m.corners[0].x, m.corners[0].y]), [bx, by] = P([m.corners[1].x, m.corners[1].y]);
    vctx.strokeStyle = '#fff'; vctx.beginPath(); vctx.moveTo(ax, ay); vctx.lineTo(bx, by); vctx.stroke();
    vctx.fillStyle = col; vctx.fillText('#' + m.id, ax, ay - 6 * devicePixelRatio);
  }

  frames++;
  if (now - lastFpsT > 1000) { fps = frames * 1000 / (now - lastFpsT); frames = 0; lastFpsT = now; }
  const corners = [1, 2, 3, 4].filter(i => markers[i]).length;
  setPill('pWs', ws.readyState === 1 ? (control ? 'ok' : 'warn') : 'bad',
    ws.readyState === 1 ? (control ? 'server' : 'server (no key!)') : 'server offline');
  setPill('pFps', fps > 8 ? 'ok' : 'warn', fps.toFixed(0) + ' fps');
  setPill('pCorners', corners === 4 ? 'ok' : 'warn', 'corners ' + corners + '/4');
  setPill('pRobot', markers[0] ? 'ok' : 'bad', markers[0] ? 'robot' : 'no robot');
  setPill('pPerson', markers[5] ? 'ok' : '', markers[5] ? 'person' : 'no person');
  $('msg').textContent = overlay ? 'Server: ' + overlay.status : (corners < 4
    ? 'Show all 4 corner markers to calibrate the arena.' : 'Calibrating...');
}
function setPill(id, cls, text) { const el = $(id); el.className = 'pill ' + cls; el.textContent = text; }

function drawOverlay(P) {
  if (!overlay) return;
  const d = devicePixelRatio;
  const poly = (pts, close) => { vctx.beginPath(); pts.forEach((p, i) => { const [x, y] = P(p); i ? vctx.lineTo(x, y) : vctx.moveTo(x, y); }); if (close) vctx.closePath(); };
  vctx.lineWidth = 2 * d; vctx.strokeStyle = 'rgba(255,255,255,.5)'; poly(overlay.arena, true); vctx.stroke();
  vctx.fillStyle = 'rgba(239,79,79,.8)';
  for (const c of overlay.cells) { const [x, y] = P(c); vctx.fillRect(x - 4 * d, y - 4 * d, 8 * d, 8 * d); }
  if (overlay.path.length) {
    vctx.lineWidth = 4 * d; vctx.strokeStyle = '#3ccf6e'; vctx.setLineDash([10 * d, 8 * d]);
    poly(overlay.path, false); vctx.stroke(); vctx.setLineDash([]);
  }
  if (overlay.target) { const [x, y] = P(overlay.target); vctx.fillStyle = '#3ccf6e'; vctx.beginPath(); vctx.arc(x, y, 9 * d, 0, 7); vctx.fill(); }
  if (overlay.home) { const [x, y] = P(overlay.home); vctx.strokeStyle = '#f5b83d'; vctx.lineWidth = 3 * d; vctx.beginPath(); vctx.arc(x, y, 10 * d, 0, 7); vctx.stroke(); }
}
</script>
</body>
</html>
